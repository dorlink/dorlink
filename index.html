<style>
/* Layout idea: one phone-width column. The brand motif is two circles drawing close, on deep ink with gold; it appears on the opening screen and the good-morning card, and everything else stays quiet. */
:root{
  --bg:#f8f5ee; --surface:#ffffff; --ink:#102a2c; --muted:#56696a; --line:#dbe3e0;
  --accent:#0f6b63; --accent-ink:#ffffff; --gold:#f2b632; --gold-soft:#fdf3d6;
  --hero:#ffe7a3; --hero-ink:#2b2410; --hero-muted:#5f5530;
  --ok:#1f7a4a; --ok-soft:#dff2e7; --warn:#96590a; --warn-soft:#fbe9c9; --crit:#b3362b; --crit-soft:#f8dedb;
  --shadow:0 1px 2px rgba(16,42,44,.06),0 10px 28px rgba(16,42,44,.08);
  --display:var(--font);
  --font:"Rubik","Segoe UI","Arial Hebrew","Noto Sans Arabic",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1819; --surface:#152628; --ink:#e9f0ee; --muted:#9db1ae; --line:#263c3d;
    --accent:#58c7ba; --accent-ink:#04201e; --gold:#f2b632; --gold-soft:#3a3013;
    --hero:#4d3f12; --hero-ink:#fff3cf; --hero-muted:#dccb92;
    --ok:#6fd39c; --ok-soft:#173826; --warn:#f0b65a; --warn-soft:#3b2d12; --crit:#f08a80; --crit-soft:#401b18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1819; --surface:#152628; --ink:#e9f0ee; --muted:#9db1ae; --line:#263c3d;
  --accent:#58c7ba; --accent-ink:#04201e; --gold:#f2b632; --gold-soft:#3a3013;
  --hero:#4d3f12; --hero-ink:#fff3cf; --hero-muted:#dccb92;
  --ok:#6fd39c; --ok-soft:#173826; --warn:#f0b65a; --warn-soft:#3b2d12; --crit:#f08a80; --crit-soft:#401b18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:10px;padding-top:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:24px;color:var(--ink);line-height:1.1}
.brand small{display:block;font-family:var(--font);font-weight:400;font-size:13px;color:var(--muted)}
.mk{width:38px;height:24px;flex:none}
.mk .a,.mark .c1{fill:var(--gold)}
.mk .b{fill:none;stroke:var(--accent);stroke-width:2.5}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--hero);color:var(--hero-ink);font-weight:500}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note button{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}
.card{background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.15;font-weight:700}
h2{font-size:22px;font-weight:700}
p{margin:0}
.muted{color:var(--muted);font-size:16px}
.hero{background:var(--hero);color:var(--hero-ink)}
.hero p{color:var(--hero-muted)}
.intro{padding:30px 24px 34px;gap:16px}
.intro h1{font-size:42px;line-height:1.08;font-weight:700}
.intro p{font-size:19px;max-width:30ch}
.mark{width:120px;height:64px}
.mark .c1{fill:var(--accent)}
.mark .c2{fill:none;stroke:var(--hero-ink);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){
  .mark .c1{animation:near1 1.1s cubic-bezier(.2,.7,.2,1) both}
  .mark .c2{animation:near2 1.1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes near1{from{transform:translateX(-14px)}to{transform:none}}
  @keyframes near2{from{transform:translateX(14px)}to{transform:none}}
  .big:active,.tile:active,.likes button:active{transform:translateY(1px) scale(.99)}
}
.ask{padding-inline:4px}
.likes{display:flex;gap:10px}
.likes button{flex:1;font-size:42px;line-height:1;padding:18px 0 14px;border-radius:20px;border:2px solid var(--gold);background:var(--surface);cursor:pointer}
.likes button span{display:block;font:500 15px var(--font);color:var(--ink);margin-top:10px}
.big{font:inherit;font-size:20px;font-weight:700;border:0;border-radius:14px;padding:14px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.14)}
.big.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>div{min-width:0}
.pill{display:inline-block;font-size:14px;font-weight:500;padding:4px 11px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-soft);color:var(--ok)} .warn{background:var(--warn-soft);color:var(--warn)} .crit{background:var(--crit-soft);color:var(--crit)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{font:inherit;font-size:19px;font-weight:500;text-align:start;min-height:118px;border-radius:22px;border:0;background:var(--surface);color:var(--ink);padding:16px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:var(--shadow)}
.ico{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.ico svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.choice{flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;min-height:0;padding:18px;font-size:22px;font-family:var(--display);font-weight:700}
.choice .go{margin-inline-start:auto;color:var(--muted);font-family:var(--font);font-weight:400}
.adminlink{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;align-self:center;padding:8px}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px}
.avatar.g{background:var(--gold);color:#3a2a00}
.list{display:flex;flex-direction:column;gap:14px}
.item{display:flex;gap:12px;align-items:center}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block}
.bubble{max-width:85%;padding:11px 15px;border-radius:18px;background:var(--bg);align-self:flex-start}
.bubble.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.bubble small{display:block;font-size:13px;opacity:.75}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
a{color:var(--accent);font-weight:500}
.week{display:flex;gap:6px}
.week i{flex:1;height:34px;border-radius:10px;background:var(--ok-soft);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--ok)}
.week i.miss{background:var(--crit-soft);color:var(--crit)}
.week i.today{outline:2px solid var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500}
td.n{font-variant-numeric:tabular-nums}
.banner{background:var(--gold-soft);border-inline-start:5px solid var(--gold);border-radius:14px;padding:13px 16px;font-weight:500}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.sub{align-self:stretch}.sub button{flex:1;padding:9px 4px}
@media (min-width:900px){.app.wide{max-width:1080px}.app.wide #main{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:18px}.app.wide #main>:first-child,.app.wide #main>.seg{grid-column:1/-1}}
.stat b{font-family:var(--display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
</style>
</head>

  else if(d.end){S.calls.unshift({k:S.incall.k,d:"now",m:0});S.incall=null;}
  else if(d.iact){S.inst[+d.i]=d.iact;S.log.unshift({k:"l_"+d.iact,w:"inst",i:+d.i,t:hhmm()});}
  else if(d.ublock){var j=+d.ublock;S.usr[j]=!S.usr[j];S.log.unshift({k:S.usr[j]?"l_block":"l_unblock",w:"usr",i:j,t:hhmm()});}
  else if(d.call)S.incall={k:d.call,v:false};
  else if(b.id==="exit"){role=null;view="home";}
  else if(b.id==="reset"){S=fresh();view="home";}
  else if(b.id==="copy"){
    var csv=[[t("name"),t("morning"),t("medsShort"),t("seen")].join(",")].concat(rows().map(function(r,i){return [t("res")[i],r[0][0],r[1][0],r[2]].join(",");})).join("\n");
    try{navigator.clipboard.writeText(csv).then(function(){S.copied=true;render();},function(){});}catch(err){}
    return;
  }
  else return;
  render();
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="f"){var v=document.getElementById("msgInput").value.trim();if(v)S.msgs.push({me:true,x:v});}
  if(e.target.id==="fm"){var fv=document.getElementById("fmInput").value.trim();if(fv)S.msgs.push({me:false,x:fv});}
  if(e.target.id==="g"){var gv=document.getElementById("ngInput").value.trim();if(gv)S.ng=gv;}
  if(e.target.id==="a"){if(document.getElementById("annInput").value.trim())S.ann=true;}
  if(e.target.id==="r"){var w=document.getElementById("remInput").value.trim();if(w){S.rem=w;S.remOk=true;}}
  render();
});
render();
</script>
